<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App Gimnasio</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">

</head>
<body>

  <!-- ================= SPLASH (igual que ahora) ================= -->
  <div id="splash">
    <h1>App Gimnasio</h1>
    <img src="icon-192.png" alt="Logo Gimnasio" id="splash-logo">
    <p>Cargando...</p>
  </div>


  <!-- ================= MENU PRINCIPAL (NUEVO) ================= -->
  <div id="vista-inicio" class="container">
    <h1>Control de Socios</h1>

    <button onclick="mostrarVista('vista-registro')">
      Registrar Socio
    </button>

    <button onclick="mostrarVista('vista-buscar')">
      Buscar Socio
    </button>
  </div>


  <!-- ================= REGISTRAR SOCIO ================= -->
  <div id="vista-registro" class="container" style="display:none;">

    <h2>Registrar Socio</h2>

    <section class="form-section">
      <form id="formRegistro">
        <input type="text" id="numero" placeholder="Número de socio" required>
        <input type="text" id="nombre" placeholder="Nombre completo" required>
        <input type="text" id="telefono" placeholder="Teléfono">
        <input type="url" id="fotoURL" placeholder="URL de la foto">
        
        <label for="fechaPago">Fecha de pago</label>
        <input type="date" id="fechaPago" required>
        
        <input type="number" id="duracion" placeholder="Duración (días)">
        <input type="text" id="promocion" placeholder="Promoción">
        <button type="submit">Registrar</button>
      </form>

      <div id="mensajeRegistro" class="mensaje"></div>
    </section>

    <button onclick="mostrarVista('vista-inicio')">← Volver</button>
  </div>


  <!-- ================= BUSCAR SOCIO ================= -->
  <div id="vista-buscar" class="container" style="display:none;">

    <h2>Buscar Socio</h2>

    <section class="form-section">
      <input type="text" id="buscarNumero" placeholder="Número de socio">
      <button id="btnBuscar">Buscar</button>
      <div id="resultado" class="resultado"></div>
    </section>

    <button onclick="mostrarVista('vista-inicio')">← Volver</button>
  </div>


  <!-- ================= SCRIPT SPLASH ================= -->
<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    const splash = document.getElementById("splash");
    if (splash) splash.style.display = "none";
  }, 4000);
});
</script>

  <!-- ================= CAMBIO DE VISTAS (NUEVO) ================= -->
  <script>
function mostrarVista(id) {
  // ocultar todas las vistas
  document.querySelectorAll("[id^='vista-']")
    .forEach(v => v.style.display = "none");

  // mostrar la vista seleccionada
  document.getElementById(id).style.display = "block";

  // limpiar resultados de búsqueda
  const resultado = document.getElementById("resultado");
  if (resultado) resultado.innerHTML = "";

  // limpiar campo de búsqueda
  const buscarNumero = document.getElementById("buscarNumero");
  if (buscarNumero) buscarNumero.value = "";
}
</script>

  <script src="app.js"></script>


  <!-- ================= SERVICE WORKER ================= -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker registrado'))
          .catch(err => console.log('Error SW:', err));
      });
    }
  </script>

</body>

</html>
